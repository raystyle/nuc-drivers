# Intel NUC X15 (LAPKC71F, Uniwill barebone ID 0x08) - keyboard backlight
# 内核自带 uniwill_laptop 会抢占 Uniwill WMI 设备,导致 tuxedo 的 uniwill_wmi
# 无法 probe(键盘背光无人驱动);blacklist 后由 tuxedo-drivers 全权接管。
blacklist uniwill_laptop
# nb02 是其他准系统的 NVIDIA 电源控制模块,在本机上被别名误拉起,无用且阻碍卸载
blacklist tuxedo_nb02_nvidia_power_ctrl
# 该机型 barebone ID (0x08) 不在 tuxedo 已知列表,EC 也不置 RGB 位,
# 实测为两级定色白光背光,强制 type 1
options tuxedo_keyboard uw_force_kbd_type=1
